<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#14273c;background:#f4f7fa;-webkit-text-size-adjust:100%}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}header{background:#142d4a;color:#fff;padding:calc(15px + env(safe-area-inset-top)) 16px 15px}.top{max-width:920px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:800;font-size:23px;letter-spacing:-.6px}.subtitle{font-size:12px;color:#c0d3e5;margin-top:3px}.pill{background:#e9f8ef;color:#157349;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:750;white-space:nowrap}nav{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #dae3ed;overflow:auto;display:flex;gap:4px;padding:8px max(10px,calc((100vw - 920px)/2));scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{background:transparent;color:#64758a;border:0;border-radius:10px;padding:11px 12px;white-space:nowrap;font-weight:700;font-size:13px}nav button.active{background:#e7f1ff;color:#165caa}main{max-width:920px;margin:0 auto;padding:16px 12px 80px}.title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}h1{font-size:22px;margin:0;letter-spacing:-.5px}h2{font-size:17px;margin:0 0 11px}h3{font-size:14px;margin:0 0 8px}p{line-height:1.45}.muted{color:#667a8e}.small{font-size:12px}.tiny{font-size:11px}.card{background:white;border:1px solid #e2e9ef;border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 2px 9px #172f4607}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:#f1f5f9;border-radius:12px;padding:12px;text-align:center}.metric strong{display:block;font-size:24px;letter-spacing:-1px}.metric span{display:block;font-size:11px;color:#607386;margin-top:4px}.green{color:#168052!important}.red{color:#c03938!important}.amber{color:#a96917!important}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:750;background:#1765c0;color:white;min-height:44px}.btn.secondary{color:#1e5c9b;background:#e8f1fb}.btn.outline{color:#38536f;background:white;border:1px solid #d3deea}.btn.danger{background:#fff0ee;color:#b8322c}.btn.full{width:100%}.btn.sm{padding:8px 10px;min-height:36px;font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:16px;width:54px;height:54px;background:#e7f1ff;font-size:28px;flex-shrink:0}.avatar.big{width:66px;height:66px;font-size:36px}.name{font-weight:800}.tag{font-size:11px;background:#edf2f7;border-radius:30px;padding:5px 8px;color:#4e6176;font-weight:700;display:inline-block}.tag.ok{background:#dff7e9;color:#157a45}.tag.bad{background:#ffebe7;color:#b83f34}.tag.warn{background:#fff2d9;color:#9b6410}.person{border-bottom:1px solid #ebeff3;padding:11px 0}.person:last-child{border:0;padding-bottom:0}.person:first-child{padding-top:0}label{display:block;font-size:12px;font-weight:750;color:#3c526a;margin:12px 0 6px}input,select{display:block;width:100%;min-width:0;background:white;border:1px solid #cdd9e5;border-radius:10px;padding:11px 12px;color:#1b3047;min-height:44px;font-size:16px}input:focus,select:focus{outline:2px solid #73a6e0;outline-offset:0}.help{font-size:12px;color:#688096;margin-top:5px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.buttons>*{flex:1}.separator{height:1px;background:#e5ebf0;margin:14px 0}.empty{text-align:center;color:#64798e;padding:24px 10px}.notice{background:#edf5ff;border:1px solid #d6e8fd;border-radius:12px;padding:12px;font-size:12px;color:#3a5979;line-height:1.5;margin-bottom:12px}.warning{background:#fff6e8;border-color:#fae3b9;color:#785517}.summary{border:2px solid #dce9f8;border-radius:14px;padding:14px;margin-top:14px}.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}.kv+.kv{border-top:1px solid #edf0f4}.chiplist{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#eaf2fb;color:#265e96;border-radius:8px;padding:7px 9px;font-size:12px}.scroll{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #e9edf1;white-space:nowrap}.table th{color:#65798f}.footer{color:#8392a3;text-align:center;font-size:11px;margin-top:20px}.hide{display:none!important}.statusbar{background:#fff8e7;color:#77521d;padding:10px 12px;font-size:12px;border-radius:10px;margin-bottom:12px}.scanbox{border:2px dashed #aac4e3;border-radius:16px;padding:20px;text-align:center;background:#f5faff}.scanbox .icon{font-size:44px}.portrait{border-radius:14px;width:54px;height:54px;object-fit:cover}.toast{position:fixed;bottom:calc(15px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:500px;margin:auto;padding:13px 16px;background:#173452;color:white;border-radius:13px;box-shadow:0 10px 28px #1234;z-index:20;font-size:13px}.avatarselect{display:flex;gap:8px;flex-wrap:wrap}.avatarselect button{border:1px solid #ccdce9;border-radius:10px;background:#f4f8fd;padding:6px;font-size:26px}.avatarselect button.active{outline:2px solid #1666c2}.count{font-size:30px;font-weight:800}.wideonly{display:none}@media(min-width:700px){main{padding:25px 20px 80px}.wideonly{display:block}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}.twocol .card{height:calc(100% - 13px)}}@media(max-width:360px){nav button{padding:9px 8px;font-size:12px}.brand{font-size:20px}.card{padding:12px}}
</style></head><body>
<header><div class="top"><div><div class="brand">🏭 AtelierPilot</div><div class="subtitle">Suivi de production • Version iPhone</div></div><span class="pill">● Démo locale</span></div></header>
<nav id="nav"><button data-tab="dashboard" class="active">📊 Accueil</button><button data-tab="scan">▣ Scanner</button><button data-tab="team">👥 Équipe</button><button data-tab="ops">⚙️ Opérations</button><button data-tab="skills">🧩 Compétences</button><button data-tab="history">🕘 Historique</button></nav>
<main id="main"><div class="card"><h1>Bienvenue sur AtelierPilot</h1><p>Chargement de ton tableau de bord…</p><p class="muted small">Si ce message reste affiché, l’aperçu de fichiers de ton téléphone bloque JavaScript. Il faudra ouvrir l’application depuis une adresse web HTTPS.</p></div></main>
<div id="toast" class="toast hide"></div>
<script>
(function(){'use strict';
var KEY='atelierpilot_iphone_v2', tab='dashboard', selected=null, editing=null, useMemory=false, db;
var defaultOps=[{id:'op1',name:'Assemblage',rate:60,lot:20},{id:'op2',name:'Découpe',rate:45,lot:15},{id:'op3',name:'Contrôle',rate:80,lot:20},{id:'op4',name:'Montage',rate:40,lot:10},{id:'op5',name:'Emballage',rate:100,lot:25}];
var names=['Marie','Jean','Sophie','Paul','Lucas','Emma','Hugo','Léa','Thomas','Chloé'], emojis=['👩🏽','👨🏻','👩🏾','👨🏽','👨🏼','👩🏼','👨🏿','👩🏻','👨🏻‍🦱','👩🏽‍🦱'];
var defaultPeople=names.map(function(n,i){return{id:'P'+String(i+1).padStart(2,'0'),name:n,avatar:emojis[i],skills: i===0?{'op1':'Expert','op3':'Autonome'}:i===1?{'op2':'Expert','op4':'Autonome'}:{[defaultOps[i%5].id]:'Autonome'},rates:{}}});
function defaults(){return{people:defaultPeople,ops:defaultOps,sessions:[],checks:[]}};
try{var saved=localStorage.getItem(KEY);db=saved?JSON.parse(saved):defaults();}catch(e){db=defaults();useMemory=true}
if(!db||!Array.isArray(db.people)||!Array.isArray(db.ops)||!Array.isArray(db.sessions)||!Array.isArray(db.checks))db=defaults();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){useMemory=true}}
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function now(){return new Date()};function localDate(d){var z=new Date((d||now()).getTime()-(d||now()).getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function localTime(d){return new Date(d||Date.now()).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function toDateTimeLocal(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}
function readable(dt){return new Date(dt).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function person(id){return db.people.find(function(x){return x.id===id})};function op(id){return db.ops.find(function(x){return x.id===id})};
function active(id){return db.sessions.find(function(s){return s.personId===id&&!s.end})}
function sessionChecks(s){return db.checks.filter(function(c){return c.sessionId===s.id}).sort(function(a,b){return new Date(a.time)-new Date(b.time)})}
function lastCheck(s){var arr=sessionChecks(s);return arr[arr.length-1]}
function sessionPieces(s,c){return (c?c.lots:0)*s.lot}
function result(s,c){var mins=Math.max(0,(new Date(c.time)-new Date(s.start))/60000);var expected=s.rate*mins/60;var actual=sessionPieces(s,c);var diff=actual-expected;return{mins:mins,expected:expected,actual:actual,diff:diff,deltaMin:s.rate>0?diff/s.rate*60:0,pct:expected>0?actual/expected*100:0}}
function fmt(n){return (Math.round(n*10)/10).toLocaleString('fr-FR')};function signed(n){return(n>0?'+':'')+fmt(n)}
function avatar(p,large){return '<span class="avatar '+(large?'big':'')+'">'+esc(p.avatar||'👤')+'</span>'}
function toast(s){var t=el('toast');t.textContent=s;t.classList.remove('hide');setTimeout(function(){t.classList.add('hide')},3000)}
function textInput(id,label,value,type,extras){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(value)+'" '+(extras||'')+'>'}
function opsOptions(selectedId){return db.ops.map(function(o){return '<option value="'+esc(o.id)+'" '+(selectedId===o.id?'selected':'')+'>'+esc(o.name)+'</option>'}).join('')}
function heading(title,extra){return '<div class="title"><h1>'+title+'</h1>'+(extra||'')+'</div>'}
function status(s){var c=lastCheck(s);return c?result(s,c):null}
function renderDashboard(){var act=db.sessions.filter(function(s){return!s.end});var withChecks=act.filter(function(s){return !!lastCheck(s)});var assessed=withChecks.map(function(s){return status(s)});var good=assessed.filter(function(x){return x.diff>=-0.0001}).length;var actual=assessed.reduce(function(x,y){return x+y.actual},0);var expected=assessed.reduce(function(x,y){return x+y.expected},0);
var html=heading('Tableau de bord','<button class="btn secondary sm" data-tab="scan">+ Contrôle</button>');
html+='<div class="grid3"><div class="metric"><strong>'+act.length+'</strong><span>En production</span></div><div class="metric"><strong>'+good+'/'+withChecks.length+'</strong><span>À l’heure*</span></div><div class="metric"><strong>'+ (expected>0?fmt(actual/expected*100)+' %':'—')+'</strong><span>Productivité*</span></div></div>';
html+='<p class="muted tiny">* Selon le dernier contrôle de chaque session active, et non en temps réel. Sans déduction automatique des pauses.</p>';
html+='<div class="card"><h2>Équipe aujourd’hui</h2>';
db.people.forEach(function(p){var s=active(p.id),c=s?lastCheck(s):null,r=c?result(s,c):null;html+='<div class="person row">'+avatar(p)+'<div class="grow"><div class="name">'+esc(p.name)+'</div><div class="small muted">'+(s?esc((op(s.opId)||{}).name||'Opération')+' · '+s.rate+' p/h':'Pas encore affecté')+'</div></div><div style="text-align:right"><span class="tag '+(r?(r.diff>=0?'ok':'bad'):(s?'warn':''))+'">'+(r?(r.diff>=0?'Avance':'Retard'):' '+(s?'En cours':'Absent'))+'</span><div class="small '+(r?(r.diff>=0?'green':'red'):'muted')+'" style="margin-top:5px">'+(r?signed(r.deltaMin)+' min':'—')+'</div></div></div>'});html+='</div>';html+='<div class="notice">💡 Scanne un badge ou sélectionne une personne dans « Scanner » pour enregistrer une affectation ou un contrôle.</div>';return html}
function renderScan(){var p=person(selected);var html=heading('Scanner un opérateur');html+='<div class="card"><div class="scanbox"><div class="icon">▣</div><h2 style="margin:5px 0">Identifier un collaborateur</h2><p class="small muted">Sur iPhone, tu peux choisir la personne ou saisir le code de son badge. La caméra est proposée si le navigateur le permet.</p><div class="buttons"><button class="btn" id="cameraBtn">📷 Caméra QR</button><button class="btn secondary" id="manualBtn">⌨️ Code badge</button></div><div id="cameraArea"></div></div><label for="pick">Ou sélectionner directement</label><select id="pick"><option value="">Choisir une personne…</option>'+db.people.map(function(x){return'<option value="'+x.id+'" '+(selected===x.id?'selected':'')+'>'+esc(x.avatar+' '+x.name+' · '+x.id)+'</option>'}).join('')+'</select></div>';
if(p){var s=active(p.id);html+='<div class="card"><div class="row">'+avatar(p,true)+'<div class="grow"><h2 style="margin:0">'+esc(p.name)+'</h2><span class="muted small">Badge '+esc(p.id)+'</span></div><span class="tag '+(s?'ok':'warn')+'">'+(s?'En production':'Sans affectation')+'</span></div>';
if(!s){html+='<h3 style="margin-top:20px">Démarrer une opération</h3><label>Opération</label><select id="assignOp">'+opsOptions(db.ops[0]?db.ops[0].id:'')+'</select><div id="opDetails"></div>'+textInput('assignStart','Heure de démarrage',toDateTimeLocal(now()),'datetime-local')+'<button class="btn full" id="startBtn" style="margin-top:14px">✅ Démarrer cette affectation</button>'}
else{var o=op(s.opId),last=lastCheck(s);html+='<div class="separator"></div><div class="grid"><div class="metric"><strong>'+s.rate+'</strong><span>Pièces/heure</span></div><div class="metric"><strong>'+s.lot+'</strong><span>Pièces/lot</span></div></div><p class="muted small">'+esc(o?o.name:'Opération')+' · Depuis '+readable(s.start)+'</p>';
html+='<label for="scanLots">Nombre total de lots depuis le démarrage</label><input id="scanLots" type="number" min="0" step="1" value="'+(last?last.lots:0)+'">'+textInput('scanTime','Heure du contrôle',toDateTimeLocal(now()),'datetime-local')+'<div id="liveResult"></div><button class="btn full" id="recordBtn" style="margin-top:12px">Enregistrer ce contrôle</button><button class="btn outline full" id="closeBtn" style="margin-top:9px">Terminer cette opération</button>'}html+='</div>'}
return html}
function opDetails(){var o=op(el('assignOp').value);if(!o)return;var p=person(selected);var custom=p&&p.rates&&p.rates[o.id];el('opDetails').innerHTML='<div class="grid">'+textInput('assignRate','Cadence (pièces/heure)',custom||o.rate,'number','min="0.01" step="any"')+textInput('assignLot','Pièces par lot',o.lot,'number','min="1" step="1"')+'</div><p class="help">Cadence standard : '+o.rate+' p/h. Tu peux personnaliser la cadence pour cette affectation.</p>'}
function liveResult(){var p=person(selected),s=p&&active(p.id);if(!s||!el('liveResult'))return;var lots=Number(el('scanLots').value),t=el('scanTime').value;if(!isFinite(lots)||lots<0||lots%1!==0||!t){el('liveResult').innerHTML='<p class="muted small">Indique un nombre entier de lots et une heure valide.</p>';return}var c={lots:lots,time:new Date(t).toISOString()},r=result(s,c);el('liveResult').innerHTML='<div class="summary"><h3>Résultat calculé</h3><div class="kv"><span>Production attendue</span><strong>'+fmt(r.expected)+' pièces</strong></div><div class="kv"><span>Production réelle</span><strong>'+fmt(r.actual)+' pièces</strong></div><div class="kv"><span>Écart pièces</span><strong class="'+(r.diff>=0?'green':'red')+'">'+signed(r.diff)+' pièces</strong></div><div class="kv"><span>Écart temps</span><strong class="'+(r.diff>=0?'green':'red')+'">'+signed(r.deltaMin)+' min</strong></div><div class="kv"><span>Productivité</span><strong>'+fmt(r.pct)+' %</strong></div></div>'}
function renderTeam(){var html=heading('Mon équipe','<button class="btn sm" id="addPerson">+ Ajouter</button>');html+='<div class="card"><p class="muted small">Chaque opérateur possède son identifiant de badge et son avatar. Tu peux les personnaliser.</p>';db.people.forEach(function(p){html+='<div class="person row">'+avatar(p)+'<div class="grow"><div class="name">'+esc(p.name)+'</div><div class="small muted">Badge '+esc(p.id)+' · '+Object.keys(p.skills||{}).length+' compétence(s)</div></div><button class="btn secondary sm" data-editperson="'+esc(p.id)+'">Modifier</button></div>'});html+='</div>';return html}
function renderPersonEdit(id){var p=person(id)||{name:'',avatar:'👤',skills:{},rates:{}};editing=id||null;var emojis=['👩🏻','👨🏻','👩🏽','👨🏽','👩🏿','👨🏿','👩🏼','👨🏼','🧑🏻','🧑🏽','🧑🏿','👩‍🔧','👨‍🔧','👩‍🏭','👨‍🏭'];var html=heading(id?'Modifier un opérateur':'Nouvel opérateur','<button class="btn secondary sm" data-tab="team">Retour</button>');html+='<div class="card">'+textInput('personName','Nom du collaborateur',p.name,'text','maxlength="60"')+'<label>Choisis un avatar</label><div class="avatarselect">'+emojis.map(function(e){return '<button type="button" data-avatar="'+e+'" class="'+(p.avatar===e?'active':'')+'">'+e+'</button>'}).join('')+'</div>'+textInput('personAvatar','Avatar choisi',p.avatar,'text','maxlength="10"')+'<p class="help">Le badge unique est généré automatiquement. Le QR code imprimable sera ajouté dans une prochaine version.</p><button id="savePerson" class="btn full" style="margin-top:14px">Enregistrer la fiche</button></div>';return html}
function renderOps(){var html=heading('Opérations','<button class="btn sm" id="addOp">+ Ajouter</button>');html+='<div class="card">';db.ops.forEach(function(o){html+='<div class="person row"><div class="grow"><div class="name">'+esc(o.name)+'</div><div class="small muted">'+o.rate+' pièces/heure · '+o.lot+' pièces/lot</div></div><button class="btn secondary sm" data-editop="'+esc(o.id)+'">Modifier</button></div>'});html+='</div>';return html}
function renderOpEdit(id){var o=op(id)||{name:'',rate:60,lot:20};editing=id||null;return heading(id?'Modifier une opération':'Nouvelle opération','<button class="btn secondary sm" data-tab="ops">Retour</button>')+'<div class="card">'+textInput('opName','Nom de l’opération',o.name,'text')+textInput('opRate','Cadence standard (pièces/heure)',o.rate,'number','min="0.01" step="any"')+textInput('opLot','Nombre de pièces par lot',o.lot,'number','min="1" step="1"')+'<button class="btn full" id="saveOp" style="margin-top:16px">Enregistrer l’opération</button></div>'}
function renderSkills(){var html=heading('Compétences');html+='<div class="notice">Cette matrice t’aide à choisir une personne qualifiée en cas d’absence. Les cadences personnalisées sont enregistrées séparément pour chaque opération.</div><div class="card"><label>Opération à remplacer</label><select id="skillOp">'+opsOptions(db.ops[0]&&db.ops[0].id)+'</select><div id="skillPeople"></div></div>';return html}
function skillPeople(){var id=el('skillOp').value,o=op(id),available=db.people.filter(function(p){return p.skills&&p.skills[id]});var html='<h3 style="margin-top:16px">Collaborateurs compétents pour '+esc(o?o.name:'cette opération')+'</h3>';if(!available.length)html+='<div class="empty">Aucune compétence enregistrée.</div>';available.forEach(function(p){var a=active(p.id);html+='<div class="person row">'+avatar(p)+'<div class="grow"><div class="name">'+esc(p.name)+'</div><div class="small muted">'+esc(p.skills[id])+' · '+(p.rates&&p.rates[id]?p.rates[id]:o.rate)+' p/h</div></div><span class="tag '+(a?'warn':'ok')+'">'+(a?'Occupé':'Disponible')+'</span></div>'});html+='<div class="separator"></div><h3>Modifier les compétences</h3><label>Collaborateur</label><select id="editSkillPerson">'+db.people.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select><label>Niveau de compétence</label><select id="skillLevel"><option value="">Non maîtrisée</option><option>Débutant</option><option>Autonome</option><option>Expert</option></select><label>Cadence personnalisée (optionnel)</label><input id="skillRate" type="number" min="0.01" step="any" placeholder="Sinon cadence standard"><button class="btn full" id="saveSkill" style="margin-top:12px">Enregistrer la compétence</button>';el('skillPeople').innerHTML=html;loadSkillEdit()}
function loadSkillEdit(){var p=person(el('editSkillPerson').value),id=el('skillOp').value;if(!p)return;el('skillLevel').value=p.skills&&p.skills[id]||'';el('skillRate').value=p.rates&&p.rates[id]||''}
function renderHistory(){var sorted=db.sessions.slice().sort(function(a,b){return new Date(b.start)-new Date(a.start)});var html=heading('Historique','<button class="btn secondary sm" id="exportBtn">⬇ CSV</button>')+'<div class="card">';if(!sorted.length)html+='<div class="empty">Aucune production enregistrée. Commence par affecter un opérateur.</div>';sorted.forEach(function(s){var p=person(s.personId),o=op(s.opId),last=lastCheck(s),r=last?result(s,last):null;html+='<div class="person"><div class="row">'+(p?avatar(p):'<span class="avatar">👤</span>')+'<div class="grow"><div class="name">'+esc(p?p.name:s.personId)+'</div><div class="small muted">'+esc(o?o.name:'Opération')+' · '+readable(s.start)+'</div></div><span class="tag '+(s.end?'':'ok')+'">'+(s.end?'Terminée':'En cours')+'</span></div><div class="small" style="margin:8px 0 0 64px">'+(r?'Dernier contrôle : '+last.lots+' lots · '+fmt(r.pct)+' % · <strong class="'+(r.diff>=0?'green':'red')+'">'+signed(r.deltaMin)+' min</strong>':'Aucun contrôle')+'</div></div>'});html+='</div><div class="card"><h2>Sauvegarde et restauration</h2><p class="small muted">Les données sont stockées uniquement sur cet appareil et peuvent être effacées par le navigateur. Exporte régulièrement une sauvegarde JSON.</p><div class="buttons"><button class="btn secondary" id="jsonBtn">Exporter JSON</button><button class="btn outline" id="importBtn">Importer JSON</button></div><input id="importFile" class="hide" type="file" accept="application/json,.json"></div>';return html}
function render(){Array.from(document.querySelectorAll('nav button')).forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab)});var html=tab==='dashboard'?renderDashboard():tab==='scan'?renderScan():tab==='team'?renderTeam():tab==='ops'?renderOps():tab==='skills'?renderSkills():tab==='history'?renderHistory():tab==='personEdit'?renderPersonEdit(editing):tab==='opEdit'?renderOpEdit(editing):renderDashboard();el('main').innerHTML=(useMemory?'<div class="statusbar">⚠️ L’aperçu bloque l’enregistrement local : les données risquent de disparaître en fermant cette page.</div>':'')+html+'<p class="footer">AtelierPilot • Prototype local • Données fictives au démarrage</p>';if(tab==='scan'){if(el('assignOp'))opDetails();if(el('scanLots'))liveResult()}if(tab==='skills')skillPeople()}
function changeTab(name){tab=name;render();window.scrollTo(0,0)}
function readNum(id){return Number(el(id).value)}
function download(name,text,type){var blob=new Blob([text],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function stopCam(){try{if(window._apStream)window._apStream.getTracks().forEach(function(t){t.stop()});window._apStream=null}catch(e){}}
function scanCamera(){var area=el('cameraArea');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof BarcodeDetector==='undefined'){area.innerHTML='<p class="small amber">Le scan caméra n’est pas disponible dans cet aperçu. Utilise le code badge ou la sélection manuelle. Sur un site HTTPS, il peut fonctionner avec un navigateur compatible.</p>';return}area.innerHTML='<video id="camVideo" playsinline autoplay muted style="width:100%;max-width:320px;border-radius:12px;margin-top:12px"></video><button class="btn danger sm" id="cancelCam" style="margin-top:8px">Arrêter la caméra</button>';navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(stream){window._apStream=stream;var v=el('camVideo');if(!v){stopCam();return}v.srcObject=stream;var detector=new BarcodeDetector({formats:['qr_code']});var alive=true;var tick=function(){if(!window._apStream||!el('camVideo'))return;detector.detect(v).then(function(codes){if(codes.length){var value=codes[0].rawValue.trim();if(person(value)){selected=value;stopCam();render();toast('Badge '+value+' identifié')}else toast('Code QR inconnu : '+value)}else requestAnimationFrame(tick)}).catch(function(){setTimeout(tick,400)})};setTimeout(tick,650)}).catch(function(){area.innerHTML='<p class="amber small">Caméra inaccessible. Autorise l’accès caméra dans Safari sur une page HTTPS, ou utilise le code badge.</p>'})}
function manualCode(){var value=prompt('Code du badge (ex. P01) :');if(value===null)return;value=value.trim().toUpperCase();if(person(value)){selected=value;render();toast('Badge identifié : '+value)}else alert('Aucun opérateur ne correspond au code « '+value+' ».')}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=b.getAttribute('data-tab');if(t){stopCam();changeTab(t);return}var ep=b.getAttribute('data-editperson'),eo=b.getAttribute('data-editop');if(ep){editing=ep;changeTab('personEdit');return}if(eo){editing=eo;changeTab('opEdit');return}var av=b.getAttribute('data-avatar');if(av){el('personAvatar').value=av;document.querySelectorAll('[data-avatar]').forEach(function(x){x.classList.toggle('active',x===b)});return}
switch(b.id){case 'cameraBtn':scanCamera();break;case 'cancelCam':stopCam();el('cameraArea').innerHTML='';break;case 'manualBtn':manualCode();break;
case 'startBtn':{var p=person(selected),o=op(el('assignOp').value),rate=readNum('assignRate'),lot=readNum('assignLot'),st=new Date(el('assignStart').value);if(!p||!o||!(rate>0)||!Number.isInteger(lot)||lot<1||isNaN(st.getTime())||st>now()){alert('Vérifie la cadence, le nombre de pièces par lot et l’heure de début.');return}if(active(p.id)){alert('Une affectation est déjà en cours.');return}db.sessions.push({id:'S'+Date.now()+'_'+Math.random().toString(36).slice(2,5),personId:p.id,opId:o.id,rate:rate,lot:lot,start:st.toISOString(),end:null});save();render();toast('Affectation démarrée pour '+p.name);break}
case 'recordBtn':{var s=active(selected),lots=readNum('scanLots'),time=new Date(el('scanTime').value),last=s&&lastCheck(s);if(!s||!Number.isInteger(lots)||lots<0||isNaN(time.getTime())||time<new Date(s.start)||time>new Date(Date.now()+60000)){alert('Vérifie les lots et l’heure du contrôle.');return}if(last&&(time<new Date(last.time)||lots<last.lots)){alert('Le total des lots et l’heure ne peuvent pas diminuer par rapport au dernier contrôle.');return}db.checks.push({id:'C'+Date.now(),sessionId:s.id,lots:lots,time:time.toISOString()});save();render();toast('Contrôle enregistré');break}
case 'closeBtn':{var s=active(selected);if(!s)return;if(!confirm('Terminer cette opération ? Pense à enregistrer ton dernier contrôle avant.'))return;s.end=now().toISOString();save();render();toast('Opération terminée');break}
case 'addPerson':editing=null;changeTab('personEdit');break;
case 'savePerson':{var name=el('personName').value.trim(),av=el('personAvatar').value.trim()||'👤';if(!name){alert('Indique un nom.');return}if(editing){var p=person(editing);if(p){p.name=name;p.avatar=av}}else{var idNum=Math.max(0,...db.people.map(function(p){return Number((p.id.match(/^P(\d+)$/)||[])[1])||0}))+1;db.people.push({id:'P'+String(idNum).padStart(2,'0'),name:name,avatar:av,skills:{},rates:{}})}save();changeTab('team');toast('Fiche enregistrée');break}
case 'addOp':editing=null;changeTab('opEdit');break;
case 'saveOp':{var name=el('opName').value.trim(),rate=readNum('opRate'),lot=readNum('opLot');if(!name||!(rate>0)||!Number.isInteger(lot)||lot<1){alert('Indique un nom, une cadence positive et un nombre entier de pièces par lot.');return}if(editing){var o=op(editing);if(o){o.name=name;o.rate=rate;o.lot=lot}}else db.ops.push({id:'op'+Date.now(),name:name,rate:rate,lot:lot});save();changeTab('ops');toast('Opération enregistrée');break}
case 'saveSkill':{var p=person(el('editSkillPerson').value),id=el('skillOp').value,level=el('skillLevel').value,rate=el('skillRate').value;if(!p)return;p.skills=p.skills||{};p.rates=p.rates||{};if(level)p.skills[id]=level;else delete p.skills[id];if(rate!==''){if(!(Number(rate)>0)){alert('La cadence doit être positive.');return}p.rates[id]=Number(rate)}else delete p.rates[id];save();skillPeople();toast('Compétence enregistrée');break}
case 'exportBtn':{var rows=[['Date','Opérateur','Opération','Cadence p/h','Pièces/lot','Heure contrôle','Lots cumulés','Pièces réalisées','Pièces attendues','Écart pièces','Écart minutes','Productivité %']];db.checks.forEach(function(c){var s=db.sessions.find(function(s){return s.id===c.sessionId});if(!s)return;var r=result(s,c);rows.push([localDate(new Date(c.time)),(person(s.personId)||{}).name||s.personId,(op(s.opId)||{}).name||s.opId,s.rate,s.lot,readable(c.time),c.lots,r.actual,fmt(r.expected),fmt(r.diff),fmt(r.deltaMin),fmt(r.pct)])});var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');download('atelierpilot_controles.csv','\ufeff'+csv,'text/csv;charset=utf-8');break}
case 'jsonBtn':download('atelierpilot_sauvegarde.json',JSON.stringify(db,null,2),'application/json');break;
case 'importBtn':el('importFile').click();break;
}});
document.addEventListener('change',function(e){if(e.target.id==='pick'){selected=e.target.value||null;stopCam();render()}if(e.target.id==='assignOp')opDetails();if(e.target.id==='skillOp')skillPeople();if(e.target.id==='editSkillPerson')loadSkillEdit();if(e.target.id==='importFile'){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!Array.isArray(data.people)||!Array.isArray(data.ops)||!Array.isArray(data.sessions)||!Array.isArray(data.checks))throw Error('format');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;db=data;save();changeTab('dashboard');toast('Sauvegarde importée')}catch(err){alert('Fichier de sauvegarde invalide.')}};reader.readAsText(file)}});
document.addEventListener('input',function(e){if(e.target.id==='scanLots'||e.target.id==='scanTime')liveResult()});
render();
})();
</script></body></html>
