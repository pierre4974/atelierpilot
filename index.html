<script>
(function(){'use strict';
var KEY='atelierpilot_iphone_v2', tab='dashboard', dashboardView='people', dashboardIlo='all', teamIlo='all', selected=null, profileId=null, editing=null, useMemory=false, db, chosenCategory=null, editingCheckId=null;
var defaultOps=[{id:'op1',name:'Assemblage',rate:60,lot:20},{id:'op2',name:'Découpe',rate:45,lot:15},{id:'op3',name:'Contrôle',rate:80,lot:20},{id:'op4',name:'Montage',rate:40,lot:10},{id:'op5',name:'Emballage',rate:100,lot:25}];
var names=['Marie','Jean','Sophie','Paul','Lucas','Emma','Hugo','Léa','Thomas','Chloé'], emojis=['👩🏽','👨🏻','👩🏾','👨🏽','👨🏼','👩🏼','👨🏿','👩🏻','👨🏻‍🦱','👩🏽‍🦱'];
var defaultPeople=names.map(function(n,i){return{id:'P'+String(i+1).padStart(2,'0'),name:n,avatar:emojis[i],skills: i===0?{'op1':'Expert','op3':'Autonome'}:i===1?{'op2':'Expert','op4':'Autonome'}:{[defaultOps[i%5].id]:'Autonome'},rates:{}}});
function defaults(){return{people:defaultPeople,ops:defaultOps,sessions:[],checks:[],categories:[{id:'ilo1',name:'ILO 1'},{id:'ilo2',name:'ILO 2'},{id:'ilo3',name:'ILO 3'}],audit:[]}};

function categoryMatchesSession(s,category){var o=op(s.opId);return category==='all'||(o&&o.categoryId===category)}
function renderIloFilter(value,view){
 var opts=[{id:'all',name:'Tout l’atelier'}].concat(db.categories);
 return '<div class="ilo-filter-heading">Catégorie ILO</div><div class="ilo-filter" role="group" aria-label="Filtrer par catégorie ILO">'+opts.map(function(c){return '<button type="button" data-ilo-view="'+view+'" data-ilo-id="'+esc(c.id)+'" class="'+(value===c.id?'active':'')+'" aria-pressed="'+(value===c.id)+'">'+esc(c.name)+'</button>'}).join('')+'</div>';
}
function recordAudit(action,info){db.audit.push({time:new Date().toISOString(),action:action,detail:info});if(db.audit.length>500)db.audit.shift()}
function uid(prefix){return prefix+Date.now()+'_'+Math.random().toString(36).slice(2,8)}

function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){useMemory=true}}
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function now(){return new Date()};function localDate(d){var z=new Date((d||now()).getTime()-(d||now()).getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function localTime(d){return new Date(d||Date.now()).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}

function active(id){return db.sessions.find(function(s){return s.personId===id&&!s.end})}

function result(s,c){var mins=Math.max(0,(new Date(c.time)-new Date(s.start))/60000);var expected=s.rate*mins/60;var actual=sessionPieces(s,c);var diff=actual-expected;return{mins:mins,expected:expected,actual:actual,diff:diff,deltaMin:s.rate>0?diff/s.rate*60:0,pct:expected>0?actual/expected*100:0}}
function fmt(n){return (Math.round(n*10)/10).toLocaleString('fr-FR')};function signed(n){return(n>0?'+':'')+fmt(n)}
function avatar(p,large){return '<span class="avatar '+(large?'big':'')+'">'+esc(p.avatar||'👤')+'</span>'}
function toast(s){var t=el('toast');t.textContent=s;t.classList.remove('hide');setTimeout(function(){t.classList.add('hide')},3000)}

function opsOptions(selectedId){return db.ops.map(function(o){return '<option value="'+esc(o.id)+'" '+(selectedId===o.id?'selected':'')+'>'+esc(categoryName(o.categoryId)+' / '+o.name)+'</option>'}).join('')}
function heading(title,extra){return '<div class="title"><h1>'+title+'</h1>'+(extra||'')+'</div>'}
function status(s){var c=lastCheck(s);return c?result(s,c):null}
// Courbe sur cinq jours calendaires, aujourd'hui inclus, à partir des contrôles enregistrés.
// Chaque écart entre deux scans est compté une seule fois et rattaché à la date du scan final.
function dailyTrend(category){
 var base=new Date();base.setHours(0,0,0,0);
 var days=[];
 for(var d=4;d>=0;d--){var z=new Date(base);z.setDate(z.getDate()-d);days.push({date:localDate(z),day:z.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.',''),num:z.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),actual:0,expected:0,count:0})}
 scopedSessions(category||'all').forEach(function(s){
  var previousTime=new Date(s.start),previousPieces=0;
  sessionChecks(s).forEach(function(c){
   var time=new Date(c.time),pieces=sessionPieces(s,c),elapsed=(time-previousTime)/3600000,increment=pieces-previousPieces;
   var item=days.find(function(x){return x.date===localDate(time)});
   if(item&&elapsed>0&&s.rate>0&&increment>=0){item.actual+=increment;item.expected+=s.rate*elapsed;item.count++}
   previousTime=time;previousPieces=pieces;
  });

}
function renderTrend(category){
 var data=dailyTrend(category||'all'),valid=data.filter(function(d){return d.pct!==null});
 var actual=valid.reduce(function(a,d){return a+d.actual},0),expected=valid.reduce(function(a,d){return a+d.expected},0);
 var avg=expected>0?fmt(actual/expected*100)+' %':'—';
 var html='<section class="card trend-card" aria-label="Courbe de productivité des cinq derniers jours"><div class="trend-heading"><div><h2>📈 Productivité · 5 jours</h2><div class="small muted">Évolution de la production dans la sélection</div></div><div class="trend-kpi">'+avg+'</div></div>';
 var W=340,L=29,R=11,T=27,B=129,step=(W-L-R)/4;
 var percentages=valid.map(function(x){return x.pct});
 var max=Math.max(120,percentages.length?Math.ceil(Math.max.apply(null,percentages)/20)*20:120),min=Math.max(0,Math.min(60,percentages.length?Math.floor(Math.min.apply(null,percentages)/20)*20:60));
 // Référence 100 % toujours visible, même avec une productivité exceptionnelle.
 min=Math.min(min,80);max=Math.max(max,120);
 var y=function(v){return T+(max-v)/(max-min)*(B-T)};
 var points=data.map(function(d,i){return {x:L+i*step,y:d.pct===null?null:y(d.pct),pct:d.pct}});
 html+='<svg class="trend-svg" viewBox="0 0 340 183" role="img" aria-label="'+esc(data.map(function(d){return d.num+': '+(d.pct===null?'pas de contrôle':fmt(d.pct)+' %')}).join(', '))+'">';
 [min,100,max].filter(function(v,i,a){return a.indexOf(v)===i}).forEach(function(v){var yy=y(v);html+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="'+(v===100?'#9aafc3':'#e6edf4')+'" stroke-width="1" '+(v===100?'stroke-dasharray="5 4"':'')+'/>';
 html+='<text x="'+(L-5)+'" y="'+(yy+3)+'" text-anchor="end" font-size="9" fill="#72859a">'+fmt(v)+'</text>'});
 // En l'absence de mesure un point reste vide, la ligne ne doit pas suggérer une mesure inventée.

case 'saveOp':{var name=el('opName').value.trim(),rate=readNum('opRate'),lot=readNum('opLot'),categoryId=el('opCategory').value;if(!name||!(rate>0)||!Number.isInteger(lot)||lot<1){alert('Indique un nom, une cadence positive et un nombre entier de pièces par lot.');return}if(editing){var o=op(editing);if(o){o.name=name;o.rate=rate;o.lot=lot;o.categoryId=categoryId}}else db.ops.push({id:uid('op'),name:name,rate:rate,lot:lot,categoryId:categoryId});chosenCategory=categoryId;save();changeTab('category');toast('Opération enregistrée');break}
case 'saveSkill':{var p=person(el('editSkillPerson').value),id=el('skillOp').value,level=el('skillLevel').value,rate=el('skillRate').value;if(!p)return;p.skills=p.skills||{};p.rates=p.rates||{};if(level)p.skills[id]=level;else delete p.skills[id];if(rate!==''){if(!(Number(rate)>0)){alert('La cadence doit être positive.');return}p.rates[id]=Number(rate)}else delete p.rates[id];save();skillPeople();toast('Compétence enregistrée');break}
case 'saveCheckEdit':{var c=db.checks.find(function(c){return c.id===editingCheckId});if(!c)return;var s=db.sessions.find(function(s){return s.id===c.sessionId});if(!s)return;var lots=readNum('editCheckLots'),time=new Date(el('editCheckTime').value);if(!Number.isInteger(lots)||lots<0||isNaN(time.getTime())||time<new Date(s.start)||(s.end&&time>new Date(s.end))||time>new Date(Date.now()+60000)){alert('Vérifie la date, l’heure et le nombre entier de lots.');return}var other=sessionChecks(s).filter(function(x){return x.id!==c.id}),prior=other.filter(function(x){return new Date(x.time)<=time}).pop(),next=other.find(function(x){return new Date(x.time)>time});if((prior&&lots<prior.lots)||(next&&lots>next.lots)){alert('Le nombre de lots doit rester croissant entre les contrôles précédents et suivants.');return}recordAudit('edit_check',JSON.stringify({before:c,after:{lots:lots,time:time.toISOString()}}));c.lots=lots;c.time=time.toISOString();save();changeTab('history');toast('Contrôle corrigé');break}
case 'exportBtn':{var rows=[['Date','Opérateur','Opération','Cadence p/h','Pièces/lot','Heure contrôle','Lots cumulés','Pièces réalisées','Pièces attendues','Écart pièces','Écart minutes','Productivité %']];db.checks.forEach(function(c){var s=db.sessions.find(function(s){return s.id===c.sessionId});if(!s)return;var r=result(s,c);rows.push([localDate(new Date(c.time)),(person(s.personId)||{}).name||s.personId,(op(s.opId)||{}).name||s.opId,s.rate,s.lot,readable(c.time),c.lots,r.actual,fmt(r.expected),fmt(r.diff),fmt(r.deltaMin),fmt(r.pct)])});var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');download('atelierpilot_controles.csv','\ufeff'+csv,'text/csv;charset=utf-8');break}
case 'jsonBtn':download('atelierpilot_sauvegarde.json',JSON.stringify(db,null,2),'application/json');break;
case 'importBtn':el('importFile').click();break;
}});
document.addEventListener('change',function(e){if(e.target.id==='pick'){selected=e.target.value||null;stopCam();render()}if(e.target.id==='assignCategory')assignCategoryOptions();if(e.target.id==='assignOp')opDetails();if(e.target.id==='skillOp')skillPeople();if(e.target.id==='editSkillPerson')loadSkillEdit();if(e.target.id==='importFile'){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!Array.isArray(data.people)||!Array.isArray(data.ops)||!Array.isArray(data.sessions)||!Array.isArray(data.checks))throw Error('format');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;db=data;save();changeTab('dashboard');toast('Sauvegarde importée')}catch(err){alert('Fichier de sauvegarde invalide.')}};reader.readAsText(file)}});
document.addEventListener('input',function(e){if(e.target.id==='scanLots'||e.target.id==='scanTime')liveResult()});
render();
})();
